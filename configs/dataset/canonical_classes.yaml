# =============================================================================
# Canonical 12-Class Schema & Standardization Configuration (Single Source of Truth)
# =============================================================================
# Standardizes piece class naming and index ordering across disparate datasets
# (Roboflow Universe, Kaggle, ChessReD, Hugging Face, Synthetic Generators).
#
# Grouped Indexing:
#   0..5 : White Pieces (Pawn, Knight, Bishop, Rook, Queen, King)
#   6..11: Black Pieces (Pawn, Knight, Bishop, Rook, Queen, King)
#
# Modulo Properties:
#   color = "white" if class_id < 6 else "black"
#   piece_type = class_id % 6 (0: Pawn, 1: Knight, 2: Bishop, 3: Rook, 4: Queen, 5: King)
# =============================================================================

canonical_classes:
  0:
    name: "white_pawn"
    piece_type: "pawn"
    color: "white"
    fen_char: "P"
  1:
    name: "white_knight"
    piece_type: "knight"
    color: "white"
    fen_char: "N"
  2:
    name: "white_bishop"
    piece_type: "bishop"
    color: "white"
    fen_char: "B"
  3:
    name: "white_rook"
    piece_type: "rook"
    color: "white"
    fen_char: "R"
  4:
    name: "white_queen"
    piece_type: "queen"
    color: "white"
    fen_char: "Q"
  5:
    name: "white_king"
    piece_type: "king"
    color: "white"
    fen_char: "K"
  6:
    name: "black_pawn"
    piece_type: "pawn"
    color: "black"
    fen_char: "p"
  7:
    name: "black_knight"
    piece_type: "knight"
    color: "black"
    fen_char: "n"
  8:
    name: "black_bishop"
    piece_type: "bishop"
    color: "black"
    fen_char: "b"
  9:
    name: "black_rook"
    piece_type: "rook"
    color: "black"
    fen_char: "r"
  10:
    name: "black_queen"
    piece_type: "queen"
    color: "black"
    fen_char: "q"
  11:
    name: "black_king"
    piece_type: "king"
    color: "black"
    fen_char: "k"

