# Coordinate validation and sanitization thresholds
sanitization:
  epsilon: 0.00001               # 1e-5 boundary tolerance for floating-point drift
  min_dimension: 0.005           # Minimum normalized width/height (approx 3-4 px on 640x640)
  min_area: 0.000025             # Minimum normalized area (w * h)
  min_visibility_ratio: 0.40     # Drop box if <40% remains after clamping to frame boundaries
